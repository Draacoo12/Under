<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Fabi - Tulipanes Amarillos</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #fffce0;
            font-family: 'Caveat', cursive, sans-serif;
            touch-action: none;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100dvh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100dvh;
            background: rgba(255, 252, 224, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.6s ease-in-out, visibility 0.6s;
            padding: 20px;
            text-align: center;
        }

        #overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #overlay h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            color: #d11a79;
            margin: 0 0 25px 0;
            padding: 0 10px;
            text-shadow: 2px 2px 8px rgba(209, 26, 121, 0.2);
            line-height: 1.1;
        }

        #start-btn {
            background: #d11a79;
            color: #fff;
            border: none;
            padding: clamp(12px, 3vh, 18px) clamp(25px, 6vw, 45px);
            font-size: clamp(1.4rem, 5vw, 2.2rem);
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Caveat', cursive;
            box-shadow: 0 8px 20px rgba(209, 26, 121, 0.35);
            transition: transform 0.25s, background 0.25s;
            outline: none;
        }

        #start-btn:active, #start-btn:hover {
            transform: scale(1.05);
            background: #b01565;
        }

        #music-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 50;
            background: rgba(255, 255, 255, 0.85);
            border: 2px solid #d11a79;
            color: #d11a79;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            font-size: 1.2rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #music-toggle.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #youtube-container {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 200px;
            height: 200px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>Para Ti Fabi 💖</h1>
        <button id="start-btn">Haz clic para tu sorpresa</button>
    </div>

    <button id="music-toggle" title="Alternar música" aria-label="Música">🎵</button>

    <canvas id="flowerCanvas"></canvas>
    
    <div id="youtube-container">
        <div id="youtube-player"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');
        const musicToggle = document.getElementById('music-toggle');

        // Configuración de YouTube
        let player = null;
        let isPlayerReady = false;
        let pendingPlay = false;
        let isMusicPlaying = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '200',
                width: '200',
                videoId: '6DcUnqZqTvI', // Keshi - Understand
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'loop': 1,
                    'playlist': '6DcUnqZqTvI',
                    'playsinline': 1,
                    'enablejsapi': 1,
                    'origin': window.location.origin || '*'
                },
                events: {
                    'onReady': () => {
                        isPlayerReady = true;
                        if (pendingPlay) playAudioSafe();
                    },
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.PLAYING) {
                            isMusicPlaying = true;
                            musicToggle.innerHTML = "🎵";
                        } else if (e.data === YT.PlayerState.PAUSED) {
                            isMusicPlaying = false;
                            musicToggle.innerHTML = "🔇";
                        }
                    }
                }
            });
        }

        function playAudioSafe() {
            if (player && isPlayerReady && typeof player.playVideo === 'function') {
                player.unMute();
                player.setVolume(100);
                player.playVideo();
                isMusicPlaying = true;
                musicToggle.innerHTML = "🎵";
            } else {
                pendingPlay = true;
            }
        }

        musicToggle.addEventListener('click', () => {
            if (!player || !isPlayerReady) return;
            if (isMusicPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        });

        // Configuración Canvas y Escalado
        let width = 0, height = 0;
        let centerX = 0, centerY = 0;
        let bouquetScale = 1;
        let dpr = 1;

        let particles = [];
        let stars = [];
        let floatingPetals = [];
        let tulipsConfig = [];
        let isPlaying = false;
        let bloomProgress = 0; // Controla la apertura fluida del ramo

        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;

            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.resetTransform();
            ctx.scale(dpr, dpr);

            centerX = width / 2;
            centerY = height * 0.53;

            const baseScaleX = width / 440;
            const baseScaleY = height / 720;
            bouquetScale = Math.min(baseScaleX, baseScaleY, 1.15) * 0.90;

            if (isPlaying) {
                createBouquet();
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // Partículas aceleradas (se arman en ~1.2s)
        class Particle {
            constructor(targetX, targetY) {
                let angle = Math.random() * Math.PI * 2;
                // Radio más cercano para que no tarden en llegar
                let radius = Math.random() * (Math.min(width, height) * 0.45) + 120;
                this.x = centerX + Math.cos(angle) * radius;
                this.y = centerY + Math.sin(angle) * radius;
                
                this.targetX = targetX;
                this.targetY = targetY;
                
                this.size = (Math.random() * 2.2 + 1.8) * Math.min(bouquetScale, 1);
                // Velocidad 3x más rápida
                this.vx = (Math.random() * 0.035) + 0.055; 
                
                // Tonos amarillos vivos y dorados
                const colors = ['#ffd600', '#ffea00', '#ffc400', '#ffb300', '#fff9c4'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.x += (this.targetX - this.x) * this.vx;
                this.y += (this.targetY - this.y) * this.vx;
            }

            draw(glowOffset) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(this.size, 1.2), 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowColor = '#ffab00';
                ctx.shadowBlur = (7 + glowOffset) * bouquetScale;
                ctx.fill();
            }
        }

        class Star {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = (Math.random() * 8 + 4) * Math.min(bouquetScale * 1.2, 1);
                this.phase = Math.random() * Math.PI * 2;
                this.speed = (Math.random() * 0.03) + 0.015;
            }

            draw() {
                this.phase += this.speed;
                let currentScale = 0.4 + Math.abs(Math.sin(this.phase)) * 0.6; 
                
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(currentScale, currentScale);
                
                ctx.beginPath();
                ctx.moveTo(0, -this.size);
                ctx.quadraticCurveTo(0, 0, this.size, 0);
                ctx.quadraticCurveTo(0, 0, 0, this.size);
                ctx.quadraticCurveTo(0, 0, -this.size, 0);
                ctx.quadraticCurveTo(0, 0, 0, -this.size);
                
                ctx.fillStyle = '#ff9800';
                ctx.shadowColor = '#ffe082';
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.restore();
            }
        }

        class FloatingPetal {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 3.5 + 2;
                this.speedY = Math.random() * 0.7 + 0.3;
                this.speedX = Math.sin(Math.random() * Math.PI) * 0.4;
                this.opacity = Math.random() * 0.7 + 0.3;
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                if (this.y < -15) {
                    this.y = height + 15;
                    this.x = Math.random() * width;
                }
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 214, 0, ${this.opacity})`;
                ctx.shadowColor = 'rgba(255, 179, 0, 0.6)';
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.restore();
            }
        }

        function isPointInPolygon(point, vs) {
            let x = point[0], y = point[1];
            let inside = false;
            for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
                let xi = vs[i][0], yi = vs[i][1];
                let xj = vs[j][0], yj = vs[j][1];
                let intersect = ((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function getPointsOnSegment(p1, p2, count) {
            let pts = [];
            for (let i = 0; i < count; i++) {
                let t = i / (count - 1 || 1);
                pts.push([ p1[0] + (p2[0] - p1[0]) * t, p1[1] + (p2[1] - p1[1]) * t ]);
            }
            return pts;
        }

        function generateTulipPoints(baseX, baseY, angle, scale) {
            let targets = [];
            
            const tulipVertices = [
                [0, 0],
                [-16, -20],
                [-22, -48],
                [-8, -34],
                [0, -52],
                [8, -34],
                [22, -48],
                [16, -20]
            ];

            // Puntos perimetrales
            for (let i = 0; i < tulipVertices.length; i++) {
                let p1 = tulipVertices[i];
                let p2 = tulipVertices[(i + 1) % tulipVertices.length];
                let edgePoints = getPointsOnSegment(p1, p2, 8);
                edgePoints.forEach(pt => targets.push({ x: pt[0], y: pt[1] }));
            }

            // Relleno interior
            let count = 0;
            while (count < 38) {
                let rx = Math.random() * 44 - 22;
                let ry = Math.random() * -52;
                if (isPointInPolygon([rx, ry], tulipVertices)) {
                    targets.push({ x: rx, y: ry });
                    count++;
                }
            }

            return targets.map(pt => {
                let sx = pt.x * scale * 1.25;
                let sy = pt.y * scale * 1.25;
                let rx = sx * Math.cos(angle) - sy * Math.sin(angle);
                let ry = sx * Math.sin(angle) + sy * Math.cos(angle);
                return { x: baseX + rx, y: baseY + ry };
            });
        }

        function createBouquet() {
            particles = [];
            stars = [];
            floatingPetals = [];
            
            tulipsConfig = [
                { bx: -48, by: -95, angle: -0.28 },
                { bx: 0,   by: -110, angle: 0 },
                { bx: 48,  by: -95, angle: 0.28 },
                { bx: -32, by: -48, angle: -0.14 },
                { bx: 32,  by: -48, angle: 0.14 },
                { bx: 0,   by: -20, angle: 0 }
            ];

            tulipsConfig.forEach(tulip => {
                let absBx = tulip.bx * bouquetScale;
                let absBy = tulip.by * bouquetScale;
                let nodes = generateTulipPoints(absBx, absBy, tulip.angle, bouquetScale);
                nodes.forEach(node => {
                    particles.push(new Particle(node.x + centerX, node.y + centerY));
                });
            });

            let starCount = width < 600 ? 18 : 30;
            for (let i = 0; i < starCount; i++) stars.push(new Star());
            for (let i = 0; i < 22; i++) floatingPetals.push(new FloatingPetal());
        }

        // Hojas verdes naturales de tulipán
        function drawTulipLeaves() {
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.scale(bouquetScale, bouquetScale);

            ctx.fillStyle = '#689f38';
            ctx.strokeStyle = '#43a047';
            ctx.lineWidth = 2;

            // Hoja izquierda
            ctx.beginPath();
            ctx.moveTo(-10, 40);
            ctx.quadraticCurveTo(-110, -20, -130, -90);
            ctx.quadraticCurveTo(-90, -40, -15, 60);
            ctx.fill();
            ctx.stroke();

            // Hoja derecha
            ctx.beginPath();
            ctx.moveTo(10, 40);
            ctx.quadraticCurveTo(110, -20, 130, -90);
            ctx.quadraticCurveTo(90, -40, 15, 60);
            ctx.fill();
            ctx.stroke();

            ctx.restore();
        }

        function drawStems() {
            ctx.save();
            ctx.translate(centerX, centerY);
            
            ctx.strokeStyle = '#558b2f';
            ctx.lineWidth = Math.max(4.5 * bouquetScale, 3);
            ctx.lineCap = 'round';

            let gatherPointY = 50 * bouquetScale;

            tulipsConfig.forEach(tulip => {
                let tulipBaseX = tulip.bx * bouquetScale;
                let tulipBaseY = tulip.by * bouquetScale;

                ctx.beginPath();
                ctx.moveTo(0, gatherPointY); 
                ctx.quadraticCurveTo(tulipBaseX * 0.5, (tulipBaseY + gatherPointY) * 0.5, tulipBaseX, tulipBaseY);
                ctx.stroke();
            });

            ctx.restore();
        }

        // Dibuja la silueta rica y sombreada de cada tulipán amarillo
        function drawRealisticTulipBodies() {
            if (bloomProgress <= 0.05) return;

            tulipsConfig.forEach(tulip => {
                ctx.save();
                ctx.translate(centerX + (tulip.bx * bouquetScale), centerY + (tulip.by * bouquetScale));
                ctx.rotate(tulip.angle);
                
                // Escala con animación de florecimiento
                let s = bouquetScale * 1.25 * Math.min(bloomProgress, 1);
                ctx.scale(s, s);
                ctx.globalAlpha = Math.min(bloomProgress * 1.2, 1);

                // 1. Pétalo central (trasero)
                let gradBack = ctx.createLinearGradient(0, 0, 0, -52);
                gradBack.addColorStop(0, '#f57f17');
                gradBack.addColorStop(0.5, '#fbc02d');
                gradBack.addColorStop(1, '#ffeb3b');
                
                ctx.fillStyle = gradBack;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(-14, -25, 0, -52);
                ctx.quadraticCurveTo(14, -25, 0, 0);
                ctx.fill();

                // 2. Pétalo izquierdo frontal
                let gradLeft = ctx.createLinearGradient(-22, 0, 0, -48);
                gradLeft.addColorStop(0, '#f57f17');
                gradLeft.addColorStop(0.4, '#fbc02d');
                gradLeft.addColorStop(0.85, '#ffea00');
                gradLeft.addColorStop(1, '#fff9c4');

                ctx.fillStyle = gradLeft;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-22, -15, -26, -38, -18, -48);
                ctx.bezierCurveTo(-12, -45, -5, -30, 0, 0);
                ctx.fill();
                ctx.strokeStyle = 'rgba(245, 127, 23, 0.4)';
                ctx.lineWidth = 1;
                ctx.stroke();

                // 3. Pétalo derecho frontal (se traslapa con el izquierdo)
                let gradRight = ctx.createLinearGradient(22, 0, 0, -48);
                gradRight.addColorStop(0, '#f57f17');
                gradRight.addColorStop(0.4, '#ffd600');
                gradRight.addColorStop(0.85, '#fff176');
                gradRight.addColorStop(1, '#ffffff');

                ctx.fillStyle = gradRight;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(22, -15, 26, -38, 18, -48);
                ctx.bezierCurveTo(10, -45, 2, -28, 0, 0);
                ctx.fill();
                ctx.strokeStyle = 'rgba(245, 127, 23, 0.4)';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Toque verde vivo en el cáliz/base
                ctx.fillStyle = '#689f38';
                ctx.beginPath();
                ctx.ellipse(0, 0, 4, 3, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            });
        }

        function drawBackgroundWrapper() {
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.scale(bouquetScale, bouquetScale);
            
            ctx.beginPath();
            ctx.moveTo(-60, 50);
            ctx.lineTo(-145, -110);
            ctx.lineTo(-80, -165);
            ctx.lineTo(0, -175);
            ctx.lineTo(80, -165);
            ctx.lineTo(145, -110);
            ctx.lineTo(60, 50);
            ctx.closePath();
            
            ctx.fillStyle = '#eddcf7';
            ctx.shadowColor = 'rgba(0,0,0,0.1)';
            ctx.shadowBlur = 12;
            ctx.fill();
            
            ctx.strokeStyle = '#c69ee6';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.restore();
        }

        function drawForegroundWrapperAndBow() {
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.scale(bouquetScale, bouquetScale);

            // Papel frontal lila
            ctx.beginPath();
            ctx.moveTo(-70, 40);
            ctx.lineTo(70, 40);
            ctx.lineTo(30, 200);
            ctx.lineTo(-30, 190);
            ctx.closePath();
            
            ctx.fillStyle = '#d8baf5';
            ctx.fill();
            ctx.strokeStyle = '#b886eb';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Pliegues decorativos
            ctx.beginPath();
            ctx.moveTo(-70, 40);
            ctx.lineTo(-20, 90);
            ctx.moveTo(70, 40);
            ctx.lineTo(30, 80);
            ctx.stroke();

            // Moño Magenta
            const ribbonColor = '#d11a79';
            ctx.fillStyle = ribbonColor;
            
            // Centro
            ctx.beginPath();
            ctx.ellipse(0, 60, 25, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            // Lados del lazo
            ctx.beginPath();
            ctx.moveTo(-15, 60);
            ctx.bezierCurveTo(-70, 15, -90, 85, -15, 65);
            ctx.moveTo(15, 60);
            ctx.bezierCurveTo(70, 15, 90, 85, 15, 65);
            ctx.fill();
            
            ctx.strokeStyle = '#a6125f';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Cintas que cuelgan
            ctx.beginPath();
            ctx.moveTo(-10, 65);
            ctx.quadraticCurveTo(-45, 130, -35, 170);
            ctx.lineTo(-20, 150);
            ctx.lineTo(-5, 70);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(10, 65);
            ctx.quadraticCurveTo(55, 140, 25, 180);
            ctx.lineTo(35, 150);
            ctx.lineTo(15, 70);
            ctx.fill();

            ctx.restore();
        }

        function drawConstellationLines() {
            ctx.lineWidth = 0.7;
            let maxDist = 24 * bouquetScale; 
            
            for (let i = 0; i < particles.length; i++) { 
                for (let j = i + 1; j < particles.length; j++) { 
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let distSq = dx * dx + dy * dy;
                    
                    if (distSq < maxDist * maxDist) {
                        let opacity = 1 - Math.sqrt(distSq) / maxDist;
                        ctx.strokeStyle = `rgba(255, 214, 0, ${opacity * 0.85})`;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function drawText() {
            let fontSize = Math.max(26, Math.min(54, width / 9.5));
            ctx.font = `bold ${fontSize}px 'Caveat', cursive`;
            ctx.fillStyle = '#d11a79'; 
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            let textY = Math.max(50, centerY - (255 * bouquetScale));
            
            ctx.shadowColor = 'rgba(209, 26, 121, 0.25)';
            ctx.shadowBlur = 10;
            
            ctx.fillText("PARA TI FABI 💖", centerX, textY);
            ctx.shadowBlur = 0;
        }

        function animate() {
            if (!isPlaying) return;
            
            ctx.fillStyle = '#fffce0';
            ctx.fillRect(0, 0, width, height);

            // 1. Estrellas
            stars.forEach(s => s.draw());

            // 2. Pétalos dorados flotantes
            floatingPetals.forEach(fp => {
                fp.update();
                fp.draw();
            });

            // 3. Envoltura trasera y hojas verdes
            drawBackgroundWrapper();
            drawTulipLeaves();

            // 4. Tallos
            drawStems();

            // 5. Cuerpos volumétricos de tulipanes amarillos
            if (bloomProgress < 1) {
                bloomProgress += 0.025; // Rápida y elegante transición
            }
            drawRealisticTulipBodies();

            // 6. Polvo de hadas y constelaciones brillantes
            let pulsate = Math.sin(Date.now() * 0.0035) * 5; 
            particles.forEach(p => {
                p.update();
                p.draw(pulsate);
            });
            drawConstellationLines();

            // 7. Envoltura frontal y moño
            drawForegroundWrapperAndBow();

            // 8. Mensaje
            drawText();

            requestAnimationFrame(animate);
        }

        // Toques en pantalla generan chispas doradas
        window.addEventListener('pointerdown', (e) => {
            if (!isPlaying || e.clientY < 60) return;
            for (let i = 0; i < 6; i++) {
                let p = new Particle(e.clientX, e.clientY);
                p.x = e.clientX + (Math.random() * 26 - 13);
                p.y = e.clientY + (Math.random() * 26 - 13);
                particles.push(p);
            }
            if (particles.length > 420) particles.splice(0, 6);
        });

        startBtn.addEventListener('click', () => {
            overlay.classList.add('hidden');
            musicToggle.classList.add('visible');
            isPlaying = true;
            bloomProgress = 0;
            
            document.fonts.ready.then(() => {
                createBouquet();
                animate();
            });
            
            playAudioSafe();
        });

    </script>
</body>
</html>
