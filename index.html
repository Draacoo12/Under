<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Fabi - Tulipanes Amarillos</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #fffce0;
            font-family: 'Caveat', cursive, sans-serif;
            touch-action: none;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100dvh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Pantalla inicial */
        #overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100dvh;
            background: rgba(255, 252, 224, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease-in-out, visibility 0.8s;
            padding: 20px;
            text-align: center;
        }

        #overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #overlay h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            color: #d11a79;
            margin: 0 0 25px 0;
            padding: 0 10px;
            text-shadow: 2px 2px 8px rgba(209, 26, 121, 0.2);
            line-height: 1.1;
        }

        #start-btn {
            background: #d11a79;
            color: #fff;
            border: none;
            padding: clamp(12px, 3vh, 18px) clamp(25px, 6vw, 45px);
            font-size: clamp(1.4rem, 5vw, 2.2rem);
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Caveat', cursive;
            box-shadow: 0 8px 20px rgba(209, 26, 121, 0.35);
            transition: transform 0.25s, background 0.25s, box-shadow 0.25s;
            outline: none;
        }

        #start-btn:active, #start-btn:hover {
            transform: scale(1.05);
            background: #b01565;
            box-shadow: 0 5px 12px rgba(209, 26, 121, 0.4);
        }

        /* Botón de control de música flotante */
        #music-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 50;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #d11a79;
            color: #d11a79;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, background 0.2s;
            font-size: 1.2rem;
            opacity: 0;
            pointer-events: none;
        }

        #music-toggle.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #music-toggle:active {
            transform: scale(0.92);
        }

        /* En lugar de display: none, lo ocultamos fuera de pantalla para que el móvil no congele el audio */
        #youtube-container {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 200px;
            height: 200px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>Para Ti Fabi 💖</h1>
        <button id="start-btn">Haz clic para tu sorpresa</button>
    </div>

    <button id="music-toggle" title="Alternar música" aria-label="Música">🎵</button>

    <canvas id="flowerCanvas"></canvas>
    
    <!-- Contenedor seguro para YouTube en móviles -->
    <div id="youtube-container">
        <div id="youtube-player"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');
        const musicToggle = document.getElementById('music-toggle');

        // Manejo del Reproductor de YouTube
        let player = null;
        let isPlayerReady = false;
        let pendingPlay = false;
        let isMusicPlaying = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '200',
                width: '200',
                videoId: '6DcUnqZqTvI', // Keshi - Understand
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'loop': 1,
                    'playlist': '6DcUnqZqTvI',
                    'playsinline': 1,
                    'enablejsapi': 1,
                    'origin': window.location.origin || '*'
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            isPlayerReady = true;
            if (pendingPlay) {
                playAudioSafe();
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isMusicPlaying = true;
                musicToggle.innerHTML = "🎵";
            } else if (event.data === YT.PlayerState.PAUSED) {
                isMusicPlaying = false;
                musicToggle.innerHTML = "🔇";
            }
        }

        function playAudioSafe() {
            if (player && isPlayerReady && typeof player.playVideo === 'function') {
                player.unMute();
                player.setVolume(100);
                player.playVideo();
                isMusicPlaying = true;
                musicToggle.innerHTML = "🎵";
            } else {
                pendingPlay = true;
            }
        }

        musicToggle.addEventListener('click', () => {
            if (!player || !isPlayerReady) return;
            if (isMusicPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        });

        // Configuración y escalado Canvas
        let width = 0, height = 0;
        let centerX = 0, centerY = 0;
        let bouquetScale = 1;
        let dpr = 1;

        let particles = [];
        let stars = [];
        let floatingPetals = [];
        let tulipsConfig = [];
        let isPlaying = false;

        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;

            // Ajuste para nitidez en pantallas de celular (Retina)
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.resetTransform();
            ctx.scale(dpr, dpr);

            centerX = width / 2;
            
            // Posicionar el centro un poco más abajo para dar aire al título superior
            centerY = height * 0.53;

            // Escalado responsivo armónico para móvil y PC
            const baseScaleX = width / 440;
            const baseScaleY = height / 720;
            bouquetScale = Math.min(baseScaleX, baseScaleY, 1.15) * 0.88;

            if (isPlaying) {
                createBouquet();
            }
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(targetX, targetY) {
                let angle = Math.random() * Math.PI * 2;
                let radius = Math.random() * (Math.max(width, height) * 0.8) + 200;
                this.x = centerX + Math.cos(angle) * radius;
                this.y = centerY + Math.sin(angle) * radius;
                
                this.targetX = targetX;
                this.targetY = targetY;
                
                this.size = (Math.random() * 2 + 1.6) * Math.min(bouquetScale, 1);
                this.vx = (Math.random() * 0.022) + 0.012;
                
                const colors = ['#ffeb3b', '#ffc107', '#ffd54f', '#fff59d', '#fff9c4'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.x += (this.targetX - this.x) * this.vx;
                this.y += (this.targetY - this.y) * this.vx;
            }

            draw(glowOffset) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(this.size, 1), 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowColor = '#fff59d';
                ctx.shadowBlur = (6 + glowOffset) * bouquetScale;
                ctx.fill();
            }
        }

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = (Math.random() * 8 + 4) * Math.min(bouquetScale * 1.2, 1);
                this.phase = Math.random() * Math.PI * 2;
                this.speed = (Math.random() * 0.025) + 0.01;
            }

            draw() {
                this.phase += this.speed;
                let currentScale = 0.4 + Math.abs(Math.sin(this.phase)) * 0.6; 
                
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(currentScale, currentScale);
                
                ctx.beginPath();
                ctx.moveTo(0, -this.size);
                ctx.quadraticCurveTo(0, 0, this.size, 0);
                ctx.quadraticCurveTo(0, 0, 0, this.size);
                ctx.quadraticCurveTo(0, 0, -this.size, 0);
                ctx.quadraticCurveTo(0, 0, 0, -this.size);
                
                ctx.fillStyle = '#ffb300';
                ctx.shadowColor = '#ffe082';
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.restore();
            }
        }

        // Pequeños pétalos de brillo flotantes
        class FloatingPetal {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 3 + 2;
                this.speedY = Math.random() * 0.5 + 0.2;
                this.speedX = Math.sin(Math.random() * Math.PI) * 0.3;
                this.opacity = Math.random() * 0.6 + 0.2;
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                if (this.y < -10) {
                    this.y = height + 10;
                    this.x = Math.random() * width;
                }
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 235, 59, ${this.opacity})`;
                ctx.shadowColor = 'rgba(255, 193, 7, 0.5)';
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.restore();
            }
        }

        function isPointInPolygon(point, vs) {
            let x = point[0], y = point[1];
            let inside = false;
            for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
                let xi = vs[i][0], yi = vs[i][1];
                let xj = vs[j][0], yj = vs[j][1];
                let intersect = ((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function getPointsOnSegment(p1, p2, count) {
            let pts = [];
            for (let i = 0; i < count; i++) {
                let t = i / (count - 1 || 1);
                pts.push([ p1[0] + (p2[0] - p1[0]) * t, p1[1] + (p2[1] - p1[1]) * t ]);
            }
            return pts;
        }

        function generateTulipShape(baseX, baseY, angle, scale) {
            let targets = [];
            
            const tulipVertices = [
                [0, 0],
                [-15, -20],
                [-20, -45],
                [-8, -32],
                [0, -50],
                [8, -32],
                [20, -45],
                [15, -20]
            ];

            // Bordes definidos
            for (let i = 0; i < tulipVertices.length; i++) {
                let p1 = tulipVertices[i];
                let p2 = tulipVertices[(i + 1) % tulipVertices.length];
                let edgePoints = getPointsOnSegment(p1, p2, 8);
                
                edgePoints.forEach(pt => {
                    targets.push({ x: pt[0], y: pt[1] });
                });
            }

            // Relleno interior
            let interiorCount = 0;
            while (interiorCount < 40) {
                let rx = (Math.random() * 40 - 20);
                let ry = (Math.random() * -50);
                
                if (isPointInPolygon([rx, ry], tulipVertices)) {
                    targets.push({ x: rx, y: ry });
                    interiorCount++;
                }
            }

            return targets.map(pt => {
                let sx = pt.x * scale * 1.25;
                let sy = pt.y * scale * 1.25;
                
                let rx = sx * Math.cos(angle) - sy * Math.sin(angle);
                let ry = sx * Math.sin(angle) + sy * Math.cos(angle);
                
                return {
                    x: baseX + rx,
                    y: baseY + ry
                };
            });
        }

        function createBouquet() {
            particles = [];
            stars = [];
            floatingPetals = [];
            
            tulipsConfig = [
                { bx: -45, by: -90, angle: -0.3 },
                { bx: 0, by: -105, angle: 0 },
                { bx: 45, by: -90, angle: 0.3 },
                { bx: -30, by: -45, angle: -0.15 },
                { bx: 30, by: -45, angle: 0.15 },
                { bx: 0, by: -20, angle: 0 }
            ];

            tulipsConfig.forEach(tulip => {
                let absBx = tulip.bx * bouquetScale;
                let absBy = tulip.by * bouquetScale;
                
                let nodes = generateTulipShape(absBx, absBy, tulip.angle, bouquetScale);
                nodes.forEach(node => {
                    particles.push(new Particle(node.x + centerX, node.y + centerY));
                });
            });

            // Cantidad de estrellas adaptada a pantalla
            let starCount = width < 600 ? 16 : 28;
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }

            // Pétalos ambientales
            for (let i = 0; i < 20; i++) {
                floatingPetals.push(new FloatingPetal());
            }
        }

        function drawStems() {
            ctx.save();
            ctx.translate(centerX, centerY);
            
            ctx.strokeStyle = '#7cb342';
            ctx.lineWidth = Math.max(4 * bouquetScale, 2.5);
            ctx.lineCap = 'round';

            let gatherPointY = 50 * bouquetScale;

            tulipsConfig.forEach(tulip => {
                let tulipBaseX = tulip.bx * bouquetScale;
                let tulipBaseY = tulip.by * bouquetScale;

                ctx.beginPath();
                ctx.moveTo(0, gatherPointY); 
                ctx.quadraticCurveTo(tulipBaseX * 0.5, (tulipBaseY + gatherPointY) * 0.5, tulipBaseX, tulipBaseY);
                ctx.stroke();
            });

            ctx.restore();
        }

        function drawBackgroundWrapper() {
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.scale(bouquetScale, bouquetScale);
            
            ctx.beginPath();
            ctx.moveTo(-60, 50);
            ctx.lineTo(-140, -110);
            ctx.lineTo(-80, -160);
            ctx.lineTo(0, -170);
            ctx.lineTo(80, -160);
            ctx.lineTo(140, -110);
            ctx.lineTo(60, 50);
            ctx.closePath();
            
            ctx.fillStyle = '#eaddf5';
            ctx.shadowColor = 'rgba(0,0,0,0.08)';
            ctx.shadowBlur = 12;
            ctx.fill();
            
            ctx.strokeStyle = '#cba3ed';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.restore();
        }

        function drawForegroundWrapperAndBow() {
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.scale(bouquetScale, bouquetScale);

            // Papel frontal
            ctx.beginPath();
            ctx.moveTo(-70, 40);
            ctx.lineTo(70, 40);
            ctx.lineTo(30, 200);
            ctx.lineTo(-30, 190);
            ctx.closePath();
            
            ctx.fillStyle = '#d3b3f2';
            ctx.fill();
            ctx.strokeStyle = '#b886eb';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Pliegues
            ctx.beginPath();
            ctx.moveTo(-70, 40);
            ctx.lineTo(-20, 90);
            ctx.moveTo(70, 40);
            ctx.lineTo(30, 80);
            ctx.stroke();

            // Moño Magenta
            const ribbonColor = '#d11a79';
            ctx.fillStyle = ribbonColor;
            
            // Centro
            ctx.beginPath();
            ctx.ellipse(0, 60, 25, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            // Lados
            ctx.beginPath();
            ctx.moveTo(-15, 60);
            ctx.bezierCurveTo(-70, 15, -90, 85, -15, 65);
            ctx.moveTo(15, 60);
            ctx.bezierCurveTo(70, 15, 90, 85, 15, 65);
            ctx.fill();
            
            ctx.strokeStyle = '#a6125f';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Tiras colgantes
            ctx.beginPath();
            ctx.moveTo(-10, 65);
            ctx.quadraticCurveTo(-45, 130, -35, 170);
            ctx.lineTo(-20, 150);
            ctx.lineTo(-5, 70);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(10, 65);
            ctx.quadraticCurveTo(55, 140, 25, 180);
            ctx.lineTo(35, 150);
            ctx.lineTo(15, 70);
            ctx.fill();

            ctx.restore();
        }

        function drawConstellationLines() {
            ctx.lineWidth = 0.6;
            let maxDist = 23 * bouquetScale; 
            
            for (let i = 0; i < particles.length; i++) { 
                for (let j = i + 1; j < particles.length; j++) { 
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let distSq = dx * dx + dy * dy;
                    
                    if (distSq < maxDist * maxDist) {
                        let opacity = 1 - Math.sqrt(distSq) / maxDist;
                        ctx.strokeStyle = `rgba(255, 235, 59, ${opacity * 0.75})`;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function drawText() {
            let fontSize = Math.max(26, Math.min(54, width / 9.5));
            ctx.font = `bold ${fontSize}px 'Caveat', cursive`;
            ctx.fillStyle = '#d11a79'; 
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Posicionamiento calculado para que nunca se monte sobre las flores
            let textY = Math.max(50, centerY - (250 * bouquetScale));
            
            ctx.shadowColor = 'rgba(209, 26, 121, 0.25)';
            ctx.shadowBlur = 10;
            
            ctx.fillText("PARA TI FABI 💖", centerX, textY);
            
            ctx.shadowBlur = 0;
        }

        function animate() {
            if (!isPlaying) return;
            
            ctx.fillStyle = '#fffce0';
            ctx.fillRect(0, 0, width, height);

            // 1. Estrellas de fondo
            stars.forEach(s => s.draw());

            // 2. Partículas ambientales
            floatingPetals.forEach(fp => {
                fp.update();
                fp.draw();
            });

            // 3. Envoltura trasera
            drawBackgroundWrapper();

            // 4. Tallos
            drawStems();

            // 5. Flores y constelaciones
            let pulsate = Math.sin(Date.now() * 0.003) * 4; 
            particles.forEach(p => {
                p.update();
                p.draw(pulsate);
            });
            drawConstellationLines();

            // 6. Envoltura frontal y moño
            drawForegroundWrapperAndBow();

            // 7. Texto del mensaje
            drawText();

            requestAnimationFrame(animate);
        }

        // Interacción al tocar la pantalla: añade pequeñas partículas extra
        window.addEventListener('pointerdown', (e) => {
            if (!isPlaying || e.clientY < 60) return;
            for (let i = 0; i < 5; i++) {
                let p = new Particle(e.clientX, e.clientY);
                p.x = e.clientX + (Math.random() * 30 - 15);
                p.y = e.clientY + (Math.random() * 30 - 15);
                particles.push(p);
            }
            if (particles.length > 400) {
                particles.splice(0, 5);
            }
        });

        startBtn.addEventListener('click', () => {
            overlay.classList.add('hidden');
            musicToggle.classList.add('visible');
            isPlaying = true;
            
            document.fonts.ready.then(() => {
                createBouquet();
                animate();
            });
            
            // Intentar reproducir música inmediatamente por la interacción directa del usuario
            playAudioSafe();
        });

    </script>
</body>
</html>
